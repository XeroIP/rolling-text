name: Bug report
description: Something in Rolling Text behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the character limit to ...
        2. Type ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the About sheet.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: os-browser
    attributes:
      label: OS version, or browser for Web
      placeholder: "Android 15 on a Pixel 8 Pro, or Chrome 141 on Windows 11"
    validations:
      required: false

  - type: input
    id: settings
    attributes:
      label: Relevant settings
      description: Character limit, theme, font, and font size, if the bug seems related to any of them.
      placeholder: "Limit 128, Sepia, JetBrains Mono, 24pt"
    validations:
      required: false

  - type: textarea
    id: text-involved
    attributes:
      label: Text involved
      description: If specific characters trigger it — emoji, flags, accents, another script — paste them here. Do not paste anything you would not want published.
    validations:
      required: false
